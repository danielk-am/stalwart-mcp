name: Upstream drift
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: Compare upstream revision with adoption baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api repos/webpatser/stalwart-mcp/commits/HEAD --jq .sha)
          if [ "$latest" != "be2c16d5921f45395996a130a5a643c542ef2105" ]; then
            echo "::error::Upstream has changed. Review, sync and rerun the fixture tests before updating."
            exit 1
          fi
